<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zuki Voice — 音声入力</title>
<meta name="description" content="話すだけで、フィラーを消して整った文章に。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23111'/%3E%3Cpath d='M16 7a4 4 0 0 1 4 4v5a4 4 0 0 1-8 0v-5a4 4 0 0 1 4-4z' fill='%23fff'/%3E%3Cpath d='M9.5 16a6.5 6.5 0 0 0 13 0' stroke='%23fff' stroke-width='2.2' fill='none' stroke-linecap='round'/%3E%3Cpath d='M16 22.5V26' stroke='%23fff' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#111113; --ink2:#5e5e66; --ink3:#a7a7b0;
  --bg:#fafaf8; --card:#fff; --line:#ececec;
  --red:#e25555; --green:#1e7a4d;
  --grad1:linear-gradient(135deg,#ffe9d6 0%,#ffd6e8 45%,#d6e4ff 100%);
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:"Inter","Noto Sans JP",system-ui,-apple-system,sans-serif;
  color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;
  min-height:100vh;
}
a{color:inherit;text-decoration:none}
.wrap{max-width:760px;margin:0 auto;padding:0 20px}

nav{position:sticky;top:0;z-index:50;background:rgba(250,250,248,.85);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav-in{display:flex;align-items:center;justify-content:space-between;height:60px;max-width:760px;margin:0 auto;padding:0 20px}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:1.08rem;letter-spacing:-.02em}
.nav-right{display:flex;align-items:center;gap:14px;font-size:.85rem;color:var(--ink2)}
.nav-right a:hover{color:var(--ink)}

main{padding:36px 0 80px}

/* ---- 録音カード ---- */
.rec-card{
  background:var(--card);border:1px solid var(--line);border-radius:28px;
  padding:34px 28px 28px;text-align:center;box-shadow:0 2px 20px rgba(0,0,0,.03);
}
.styles{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:26px}
.style-chip{
  border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 18px;
  font-size:.86rem;font-weight:600;color:var(--ink2);cursor:pointer;font-family:inherit;
  transition:all .15s;
}
.style-chip:hover{border-color:var(--ink3)}
.style-chip.on{background:var(--ink);border-color:var(--ink);color:#fff}

.mic-btn{
  width:108px;height:108px;border-radius:50%;border:none;cursor:pointer;
  background:var(--ink);color:#fff;display:inline-flex;align-items:center;justify-content:center;
  transition:transform .15s,box-shadow .2s,background .2s;position:relative;
}
.mic-btn:hover{transform:scale(1.05);box-shadow:0 12px 36px rgba(0,0,0,.22)}
.mic-btn:active{transform:scale(.97)}
.mic-btn.recording{background:var(--red)}
.mic-btn.recording::before{
  content:"";position:absolute;inset:-10px;border-radius:50%;
  border:2px solid rgba(226,85,85,.4);animation:ring 1.6s infinite;
}
@keyframes ring{0%{transform:scale(.9);opacity:1}100%{transform:scale(1.35);opacity:0}}
.mic-btn svg{width:42px;height:42px}
.mic-btn:disabled{opacity:.5;cursor:wait;transform:none}

.rec-status{margin-top:18px;font-size:.95rem;color:var(--ink2);min-height:1.5em;font-weight:500}
.rec-status b{color:var(--red);font-variant-numeric:tabular-nums}
.hint{margin-top:6px;font-size:.8rem;color:var(--ink3)}
.hint kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;font-family:inherit;background:#fff}

canvas#wave{display:block;margin:20px auto 0;width:100%;max-width:420px;height:52px}

.live{
  margin-top:18px;text-align:left;font-size:.98rem;line-height:1.9;color:var(--ink2);
  max-height:130px;overflow-y:auto;padding:0 6px;display:none;
}
.live.show{display:block}

.drop-note{margin-top:22px;font-size:.82rem;color:var(--ink3)}
.drop-note button{border:none;background:none;color:var(--ink2);text-decoration:underline;cursor:pointer;font:inherit}
.drop-note button:hover{color:var(--ink)}
body.dragging .rec-card{outline:2.5px dashed var(--ink3);outline-offset:6px}

/* ---- 結果カード ---- */
.result{
  margin-top:22px;border-radius:28px;padding:30px 28px;background:var(--grad1);
  display:none;animation:slideUp .45s ease;
}
.result.show{display:block}
@keyframes slideUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.result .head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.result .head .ttl{font-size:.8rem;font-weight:800;letter-spacing:.08em;color:#7a4a2b}
.result .head .meta{font-size:.76rem;color:#9a6a4b}
.polished{
  background:rgba(255,255,255,.75);border-radius:18px;padding:20px 22px;
  font-size:1.06rem;line-height:2;white-space:pre-wrap;word-break:break-word;min-height:60px;
}
.polished[contenteditable]:focus{outline:2px solid rgba(0,0,0,.15)}
.result .actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.btn{
  display:inline-flex;align-items:center;gap:8px;border:none;cursor:pointer;
  border-radius:999px;padding:11px 22px;font-size:.88rem;font-weight:600;font-family:inherit;
  background:var(--ink);color:#fff;transition:transform .15s,box-shadow .15s;
}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(0,0,0,.18)}
.btn.sub{background:rgba(255,255,255,.8);color:var(--ink)}
.raw-tgl{margin-top:16px;font-size:.82rem;color:#9a6a4b}
.raw-tgl summary{cursor:pointer;font-weight:600;user-select:none}
.raw-txt{margin-top:10px;background:rgba(255,255,255,.55);border-radius:14px;padding:14px 18px;line-height:1.9;white-space:pre-wrap;color:#6b4a33}

/* ---- 履歴 ---- */
.hist-sec{margin-top:46px}
.hist-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.hist-head h2{font-size:1.05rem;font-weight:800;letter-spacing:-.01em}
.hist-head button{border:none;background:none;color:var(--ink3);font-size:.8rem;cursor:pointer;font-family:inherit}
.hist-head button:hover{color:var(--red)}
.hist-item{
  background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 20px;
  margin-bottom:10px;display:flex;gap:14px;align-items:flex-start;
}
.hist-item .txt{flex:1;font-size:.92rem;line-height:1.8;white-space:pre-wrap;word-break:break-word}
.hist-item .when{font-size:.72rem;color:var(--ink3);margin-top:6px}
.hist-item .ops{display:flex;gap:4px;flex-shrink:0}
.icon-btn{
  width:34px;height:34px;border-radius:10px;border:none;background:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;color:var(--ink3);
}
.icon-btn:hover{background:var(--bg);color:var(--ink)}
.empty{color:var(--ink3);font-size:.88rem;text-align:center;padding:26px 0}

/* ---- 個人辞書 ---- */
.dict-add{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.dict-add input{
  flex:1;min-width:150px;border:1.5px solid var(--line);border-radius:12px;
  padding:10px 14px;font:inherit;font-size:.9rem;background:#fff;color:var(--ink);
}
.dict-add input:focus{outline:none;border-color:var(--ink3)}
.dict-list{display:flex;gap:8px;flex-wrap:wrap}
.dict-chip{
  display:inline-flex;align-items:center;gap:8px;background:var(--card);
  border:1px solid var(--line);border-radius:999px;padding:7px 8px 7px 16px;font-size:.87rem;
}
.dict-chip .w{color:var(--ink3);font-size:.78rem}
.dict-chip button{
  width:22px;height:22px;border-radius:50%;border:none;background:var(--bg);
  color:var(--ink3);cursor:pointer;font-size:.8rem;line-height:1;
}
.dict-chip button:hover{background:#fde3e3;color:var(--red)}

/* ---- トースト ---- */
#toast{
  position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:#fff;border-radius:999px;padding:11px 24px;font-size:.88rem;
  opacity:0;pointer-events:none;transition:all .3s;z-index:100;
}
#toast.show{opacity:1;transform:translateX(-50%)}

.spinner{width:17px;height:17px;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:inline-block;vertical-align:-3px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<nav>
  <div class="nav-in">
    <a class="logo" href="/">
      <svg width="26" height="26" viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#111113"/><path d="M16 7a4 4 0 0 1 4 4v5a4 4 0 0 1-8 0v-5a4 4 0 0 1 4-4z" fill="#fff"/><path d="M9.5 16a6.5 6.5 0 0 0 13 0" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round"/><path d="M16 22.5V26" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg>
      Zuki Voice
    </a>
    <div class="nav-right"><a href="/">← ホーム</a></div>
  </div>
</nav>

<main class="wrap">
  <div class="rec-card">
    <div class="styles" id="styles">
      <button class="style-chip on" data-style="clean">✦ そのまま整える</button>
      <button class="style-chip" data-style="mail">📧 メール</button>
      <button class="style-chip" data-style="chat">💬 チャット</button>
      <button class="style-chip" data-style="bullets">📋 箇条書き</button>
    </div>

    <button class="mic-btn" id="micBtn" title="録音の開始 / 停止">
      <svg id="micIco" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 3a3.2 3.2 0 0 1 3.2 3.2v5.6a3.2 3.2 0 0 1-6.4 0V6.2A3.2 3.2 0 0 1 12 3z" fill="currentColor" stroke="none"/><path d="M6.5 11.8a5.5 5.5 0 0 0 11 0"/><path d="M12 17.3V21"/></svg>
      <svg id="stopIco" viewBox="0 0 24 24" style="display:none"><rect x="7" y="7" width="10" height="10" rx="2.5" fill="currentColor"/></svg>
    </button>

    <div class="rec-status" id="status">マイクボタンを押して話してください</div>
    <div class="hint"><kbd>Space</kbd> で開始・停止　／　話し終えると自動で整形されます</div>
    <canvas id="wave" width="840" height="104"></canvas>
    <div class="live" id="live"></div>
    <div class="drop-note">音声ファイル（mp3 / m4a / wav など）をここにドラッグ、または<button id="pickFile">ファイルを選ぶ</button>こともできます
      <input type="file" id="fileInput" accept="audio/*" hidden>
    </div>
  </div>

  <div class="result" id="result">
    <div class="head">
      <div class="ttl">✦ 整形されたテキスト</div>
      <div class="meta" id="meta"></div>
    </div>
    <div class="polished" id="polished" contenteditable="true" spellcheck="false"></div>
    <div class="actions">
      <button class="btn" id="copyBtn">📋 コピー</button>
      <button class="btn sub" id="redoBtn">↻ 別のスタイルで整え直す</button>
    </div>
    <details class="raw-tgl" id="rawWrap">
      <summary>元の文字起こしを見る</summary>
      <div class="raw-txt" id="rawTxt"></div>
    </details>
  </div>

  <div class="hist-sec">
    <div class="hist-head">
      <h2>個人辞書 <span style="color:var(--ink3);font-weight:500;font-size:.8rem">（よく使う言葉を登録すると、聞き取りと整形がこの表記に寄ります）</span></h2>
    </div>
    <div class="dict-add">
      <input type="text" id="dictRight" placeholder="正しい表記（例：Shopee）" maxlength="40">
      <input type="text" id="dictWrong" placeholder="読み・よくある誤り（例：しょっぴー）※任意" maxlength="40">
      <button class="btn" id="dictAdd" style="padding:10px 20px">追加</button>
    </div>
    <div id="dictList" class="dict-list"></div>
  </div>

  <div class="hist-sec">
    <div class="hist-head">
      <h2>履歴 <span style="color:var(--ink3);font-weight:500;font-size:.8rem">（このブラウザにだけ保存）</span></h2>
      <button id="clearHist">すべて削除</button>
    </div>
    <div id="histList"></div>
  </div>
</main>

<div id="toast"></div>

<script>
"use strict";
/* ================= 状態 ================= */
const API = location.origin;
let style = "clean";
let recording = false, busy = false;
let mediaRecorder = null, chunks = [], stream = null;
let audioCtx = null, analyser = null, rafId = 0;
let recStart = 0, timerId = 0;
let speechRec = null, liveFinal = "", liveInterim = "";
let lastRaw = "";  // 直近の文字起こし（整え直し用）

const $ = (id) => document.getElementById(id);
const micBtn = $("micBtn"), statusEl = $("status"), liveEl = $("live");
const resultEl = $("result"), polishedEl = $("polished"), rawTxt = $("rawTxt"), metaEl = $("meta");

/* ================= スタイル切替 ================= */
$("styles").addEventListener("click", (e) => {
  const b = e.target.closest(".style-chip"); if (!b) return;
  document.querySelectorAll(".style-chip").forEach(x => x.classList.toggle("on", x === b));
  style = b.dataset.style;
});

/* ================= 録音 ================= */
micBtn.addEventListener("click", () => recording ? stopRec() : startRec());
addEventListener("keydown", (e) => {
  if (e.code === "Space" && !e.repeat && document.activeElement !== polishedEl &&
      !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) {
    e.preventDefault(); recording ? stopRec() : startRec();
  }
});

async function startRec() {
  if (busy) return;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (err) {
    setStatus("マイクが使えません。ブラウザのマイク許可を確認してください");
    return;
  }
  chunks = [];
  const mime = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4"].find(m => MediaRecorder.isTypeSupported(m)) || "";
  mediaRecorder = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
  mediaRecorder.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
  mediaRecorder.onstop = onRecorded;
  mediaRecorder.start(250);

  recording = true; recStart = Date.now();
  micBtn.classList.add("recording");
  $("micIco").style.display = "none"; $("stopIco").style.display = "block";
  liveFinal = ""; liveInterim = "";
  liveEl.textContent = ""; liveEl.classList.add("show");
  startWave(); startTimer(); startLive();
}

function stopRec() {
  if (!recording) return;
  recording = false;
  micBtn.classList.remove("recording");
  $("micIco").style.display = "block"; $("stopIco").style.display = "none";
  clearInterval(timerId); cancelAnimationFrame(rafId); clearWave();
  stopLive();
  if (mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop();
  if (stream) stream.getTracks().forEach(t => t.stop());
}

function startTimer() {
  timerId = setInterval(() => {
    const s = Math.floor((Date.now() - recStart) / 1000);
    setStatus(`<b>● ${String(Math.floor(s / 60)).padStart(1, "0")}:${String(s % 60).padStart(2, "0")}</b>　録音中… もう一度押すと停止`);
    if (s >= 300) stopRec(); // 5分で自動停止
  }, 250);
}

/* ---- 波形 ---- */
function startWave() {
  const canvas = $("wave"), ctx2 = canvas.getContext("2d");
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const src = audioCtx.createMediaStreamSource(stream);
  analyser = audioCtx.createAnalyser(); analyser.fftSize = 256;
  src.connect(analyser);
  const data = new Uint8Array(analyser.frequencyBinCount);
  const draw = () => {
    rafId = requestAnimationFrame(draw);
    analyser.getByteFrequencyData(data);
    ctx2.clearRect(0, 0, canvas.width, canvas.height);
    const bars = 48, step = Math.floor(data.length / bars), bw = canvas.width / bars;
    ctx2.fillStyle = "#111113";
    for (let i = 0; i < bars; i++) {
      const v = data[i * step] / 255;
      const h = Math.max(4, v * canvas.height * .9);
      const x = i * bw + bw * .25, y = (canvas.height - h) / 2;
      roundRect(ctx2, x, y, bw * .5, h, bw * .25);
    }
  };
  draw();
}
function roundRect(c, x, y, w, h, r) { c.beginPath(); c.roundRect(x, y, w, h, r); c.fill(); }
function clearWave() {
  const canvas = $("wave");
  canvas.getContext("2d").clearRect(0, 0, canvas.width, canvas.height);
  if (audioCtx) { audioCtx.close().catch(() => {}); audioCtx = null; }
}

/* ---- ライブ字幕（Web Speech API・対応ブラウザのみ） ---- */
function startLive() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return;
  speechRec = new SR();
  speechRec.lang = "ja-JP"; speechRec.continuous = true; speechRec.interimResults = true;
  speechRec.onresult = (e) => {
    liveInterim = "";
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const r = e.results[i];
      if (r.isFinal) liveFinal += r[0].transcript;
      else liveInterim += r[0].transcript;
    }
    liveEl.textContent = liveFinal + liveInterim;
    liveEl.scrollTop = liveEl.scrollHeight;
  };
  speechRec.onerror = () => {};
  try { speechRec.start(); } catch (e) {}
}
function stopLive() { if (speechRec) { try { speechRec.stop(); } catch (e) {} speechRec = null; } }

/* ================= 文字起こし → 整形 ================= */
async function onRecorded() {
  const blob = new Blob(chunks, { type: chunks[0] ? chunks[0].type : "audio/webm" });
  if (blob.size < 2000) { setStatus("録音が短すぎました。もう一度どうぞ"); liveEl.classList.remove("show"); return; }
  await processAudio(blob);
}

async function processAudio(blob) {
  busy = true; micBtn.disabled = true;
  setStatus('<span class="spinner"></span> 文字起こし中…');
  let raw = "";
  try {
    const b64 = await blobToBase64(blob);
    const r = await fetch(API + "/api/transcribe", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ audio: b64, dict: loadDict() }),
    });
    const j = await r.json().catch(() => null);
    if (j && j.ok && j.text) raw = j.text.trim();
  } catch (e) {}

  // Whisperがダメでもライブ字幕が取れていればそれを使う
  if (!raw && liveFinal.trim()) raw = liveFinal.trim();
  liveEl.classList.remove("show");

  if (!raw) {
    setStatus("うまく聞き取れませんでした。もう一度どうぞ");
    busy = false; micBtn.disabled = false;
    return;
  }
  lastRaw = raw;
  await polish(raw);
}

async function polish(raw) {
  busy = true; micBtn.disabled = true;
  setStatus('<span class="spinner"></span> AIが整形中…');
  let polished = raw, engine = "";
  try {
    const r = await fetch(API + "/api/polish", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ text: raw, style, dict: loadDict() }),
    });
    const j = await r.json().catch(() => null);
    if (j && j.ok && j.text) { polished = j.text; engine = j.engine; }
  } catch (e) {}

  showResult(raw, polished, engine);
  saveHistory(polished);
  // そのまま貼り付けられるように自動コピー（失敗しても静かに無視）
  try { await navigator.clipboard.writeText(polished); toast("整形してコピーしました"); setStatus("コピー済み。あとは貼り付けるだけ"); }
  catch (e) { setStatus("できました。続けてどうぞ"); }
  busy = false; micBtn.disabled = false;
}

function showResult(raw, polished, engine) {
  polishedEl.textContent = polished;
  rawTxt.textContent = raw;
  const engName = { claude: "Claude", "workers-ai": "Workers AI", rules: "ルール整形" }[engine] || "";
  const styleName = { clean: "そのまま整える", mail: "メール", chat: "チャット", bullets: "箇条書き" }[style];
  metaEl.textContent = `${styleName}${engName ? "・" + engName : ""}・${raw.length}文字 → ${polished.length}文字`;
  resultEl.classList.add("show");
  $("rawWrap").open = false;
  resultEl.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

/* コピー・整え直し */
$("copyBtn").addEventListener("click", async () => {
  await navigator.clipboard.writeText(polishedEl.textContent);
  toast("コピーしました");
});
$("redoBtn").addEventListener("click", () => { if (lastRaw && !busy) polish(lastRaw); });

/* ================= ファイル読み込み ================= */
$("pickFile").addEventListener("click", () => $("fileInput").click());
$("fileInput").addEventListener("change", (e) => {
  const f = e.target.files[0];
  if (f) processAudio(f);
  e.target.value = "";
});
let dragDepth = 0;
addEventListener("dragenter", (e) => { e.preventDefault(); dragDepth++; document.body.classList.add("dragging"); });
addEventListener("dragleave", () => { if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove("dragging"); } });
addEventListener("dragover", (e) => e.preventDefault());
addEventListener("drop", (e) => {
  e.preventDefault(); dragDepth = 0; document.body.classList.remove("dragging");

/* ================= 個人辞書（localStorage） ================= */
// ずくさんの言葉の癖はここに足していく（seedVerを上げると既存ユーザーにも追記される。
// ユーザーが消した・直した分は上書きしない）
const DICT_SEED_VER = 1;
const DICT_SEED = [
  { r: "Zuki Voice", w: "ずきぼいす" },
  { r: "JOOM", w: "じゅーむ" },
  { r: "Shopee", w: "しょっぴー" },
  { r: "eBay", w: "いーべい" },
  { r: "クーパン", w: "Coupang" },
  { r: "チャットワーク" },
  { r: "クラウドワークス" },
  { r: "Cloudflare", w: "クラウドフレア" },
  { r: "駿河屋" },
  { r: "オークファン" },
  { r: "一番くじ" },
  { r: "遊戯王" },
  { r: "ポケカ" },
];
const DKEY = "zv_dict", DVKEY = "zv_dict_seedver", DDELKEY = "zv_dict_removed";
function loadDict() { try { return JSON.parse(localStorage.getItem(DKEY)) || []; } catch (e) { return []; } }
function storeDict(d) { try { localStorage.setItem(DKEY, JSON.stringify(d.slice(0, 100))); } catch (e) {} }
function seedDict() {
  const ver = Number(localStorage.getItem(DVKEY) || 0);
  if (ver >= DICT_SEED_VER) return;
  let removed = []; try { removed = JSON.parse(localStorage.getItem(DDELKEY)) || []; } catch (e) {}
  const d = loadDict();
  for (const s of DICT_SEED) {
    if (!d.some(x => x.r === s.r) && !removed.includes(s.r)) d.push({ ...s });
  }
  storeDict(d);
  localStorage.setItem(DVKEY, String(DICT_SEED_VER));
}
function renderDict() {
  const d = loadDict(), el = $("dictList");
  el.innerHTML = "";
  if (!d.length) { el.innerHTML = '<div class="empty" style="padding:10px 0">まだ登録がありません</div>'; return; }
  d.forEach((item, i) => {
    const chip = document.createElement("span"); chip.className = "dict-chip";
    const main = document.createElement("span"); main.textContent = item.r;
    chip.appendChild(main);
    if (item.w) { const w = document.createElement("span"); w.className = "w"; w.textContent = "← " + item.w; chip.appendChild(w); }
    const del = document.createElement("button"); del.textContent = "✕"; del.title = "削除";
    del.onclick = () => {
      const d2 = loadDict(); const [rm] = d2.splice(i, 1); storeDict(d2);
      try { const rem = JSON.parse(localStorage.getItem(DDELKEY)) || []; if (rm && !rem.includes(rm.r)) { rem.push(rm.r); localStorage.setItem(DDELKEY, JSON.stringify(rem)); } } catch (e) {}
      renderDict();
    };
    chip.appendChild(del);
    el.appendChild(chip);
  });
}
$("dictAdd").addEventListener("click", () => {
  const r = $("dictRight").value.trim(), w = $("dictWrong").value.trim();
  if (!r) { $("dictRight").focus(); return; }
  const d = loadDict();
  if (d.some(x => x.r === r)) { toast("登録済みです"); return; }
  d.push(w ? { r, w } : { r }); storeDict(d);
  $("dictRight").value = ""; $("dictWrong").value = ""; $("dictRight").focus();
  renderDict(); toast("辞書に追加しました");
});
$("dictWrong").addEventListener("keydown", e => { if (e.key === "Enter") $("dictAdd").click(); });
$("dictRight").addEventListener("keydown", e => { if (e.key === "Enter") $("dictAdd").click(); });
seedDict(); renderDict();

/* ================= 履歴（localStorage） ================= */
const HKEY = "zv_history";
function loadHistory() { try { return JSON.parse(localStorage.getItem(HKEY)) || []; } catch (e) { return []; } }
function saveHistory(text) {
  const h = loadHistory();
  h.unshift({ t: text, at: Date.now() });
  try { localStorage.setItem(HKEY, JSON.stringify(h.slice(0, 50))); } catch (e) {}
  renderHistory();
}
function renderHistory() {
  const h = loadHistory(), el = $("histList");
  if (!h.length) { el.innerHTML = '<div class="empty">まだ履歴はありません。話してみましょう 🎙️</div>'; return; }
  el.innerHTML = "";
  h.forEach((item, i) => {
    const d = new Date(item.at);
    const row = document.createElement("div"); row.className = "hist-item";
    const txt = document.createElement("div"); txt.className = "txt";
    txt.textContent = item.t;
    const when = document.createElement("div"); when.className = "when";
    when.textContent = `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
    txt.appendChild(when);
    const ops = document.createElement("div"); ops.className = "ops";
    const cp = document.createElement("button"); cp.className = "icon-btn"; cp.title = "コピー";
    cp.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>';
    cp.onclick = async () => { await navigator.clipboard.writeText(item.t); toast("コピーしました"); };
    const del = document.createElement("button"); del.className = "icon-btn"; del.title = "削除";
    del.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>';
    del.onclick = () => { const h2 = loadHistory(); h2.splice(i, 1); localStorage.setItem(HKEY, JSON.stringify(h2)); renderHistory(); };
    ops.append(cp, del);
    row.append(txt, ops);
    el.appendChild(row);
  });
}
$("clearHist").addEventListener("click", () => {
  if (confirm("履歴をすべて削除しますか？")) { localStorage.removeItem(HKEY); renderHistory(); }
});
renderHistory();

/* ================= 小道具 ================= */
function setStatus(html) { statusEl.innerHTML = html; }
function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(t._tm); t._tm = setTimeout(() => t.classList.remove("show"), 1800);
}
function blobToBase64(blob) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => res(String(fr.result).split(",")[1] || "");
    fr.onerror = rej;
    fr.readAsDataURL(blob);
  });
}
