<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zuki Voice ミニ</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23111'/%3E%3Cpath d='M16 7a4 4 0 0 1 4 4v5a4 4 0 0 1-8 0v-5a4 4 0 0 1 4-4z' fill='%23fff'/%3E%3Cpath d='M9.5 16a6.5 6.5 0 0 0 13 0' stroke='%23fff' stroke-width='2.2' fill='none' stroke-linecap='round'/%3E%3Cpath d='M16 22.5V26' stroke='%23fff' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
/* macOSの音声入力ピル風ミニウィンドウ */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;
  background:#000;color:#fff;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;user-select:none;
}
.pill{
  display:flex;align-items:center;gap:8px;
  background:#000;border-radius:999px;padding:5px;
  box-shadow:0 0 0 .5px rgba(255,255,255,.18);
}
.cbtn{
  width:28px;height:28px;border-radius:50%;border:none;cursor:pointer;flex:none;
  display:flex;align-items:center;justify-content:center;
  transition:transform .12s,background .15s;
}
.cbtn:hover{transform:scale(1.08)}
.cbtn:active{transform:scale(.94)}
.cbtn.x{background:#3a3a3c;color:#fff}
.cbtn.ok{background:#fff;color:#000}
.cbtn:disabled{opacity:.4;cursor:default;transform:none}
.mid{width:84px;height:20px;display:flex;align-items:center;justify-content:center}
canvas#wave{width:84px;height:20px;display:block}
.status{font-size:10.5px;color:#98989f;white-space:nowrap;letter-spacing:.02em}
.status.ok{color:#6fd68a}
.spin{
  width:14px;height:14px;border:2px solid rgba(255,255,255,.25);border-top-color:#fff;
  border-radius:50%;animation:sp .7s linear infinite;margin-right:5px;flex:none;
}
@keyframes sp{to{transform:rotate(360deg)}}
.hidden{display:none!important}
</style>
</head>
<body>

<div class="pill">
  <button class="cbtn x" id="cancelBtn" title="キャンセル（Esc）">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <div class="mid">
    <canvas id="wave" width="168" height="40" class="hidden"></canvas>
    <div class="spin hidden" id="spin"></div>
    <div class="status" id="status">準備中…</div>
  </div>
  <button class="cbtn ok" id="okBtn" title="確定（fn / Enter）">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.5l5 5L19.5 7"/></svg>
  </button>
</div>

<script>
"use strict";
const $=id=>document.getElementById(id);
const statusEl=$("status"),okBtn=$("okBtn"),cancelBtn=$("cancelBtn"),spin=$("spin"),waveC=$("wave");
let mediaRecorder=null,chunks=[],stream=null,audioCtx=null,rafId=0,done=false;

/* 全画面で開いてしまった場合に備えて、小さく・画面下中央に整える */
try{
  const W=220,H=96;
  window.resizeTo(W,H);
  window.moveTo(Math.round((screen.availWidth-W)/2), Math.max(0, screen.availHeight-H-60));
}catch(e){}

async function start(){
  try{ stream=await getMacMic(); }
  catch(e){ say("マイク不可"); okBtn.disabled=true; return; }
  const mime=["audio/webm;codecs=opus","audio/webm","audio/mp4"].find(m=>MediaRecorder.isTypeSupported(m))||"";
  mediaRecorder=new MediaRecorder(stream,mime?{mimeType:mime}:undefined);
  mediaRecorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
  mediaRecorder.onstop=onStopped;
  mediaRecorder.start(250);
  statusEl.classList.add("hidden"); waveC.classList.remove("hidden");
  startWave();
  setTimeout(()=>{ if(!done) finish(); }, 300000); // 5分で自動確定
}

/* iPhone（連係カメラのマイク）を避けて、Mac本体のマイクを優先する */
async function getMacMic(){
  const isPhone=l=>/iphone|ipad|continuity|連係/i.test(l||"");
  const isBuiltIn=l=>/macbook|built-?in|内蔵/i.test(l||"");
  const pick=async()=>{
    const mics=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==="audioinput"&&d.deviceId!=="default"&&d.deviceId!=="communications");
    return mics.find(d=>isBuiltIn(d.label)) || mics.find(d=>d.label&&!isPhone(d.label)) || null;
  };
  let dev=await pick();
  let s=await navigator.mediaDevices.getUserMedia({audio:dev?{deviceId:{exact:dev.deviceId}}:true});
  const label=(s.getAudioTracks()[0]||{}).label;
  if(!dev && isPhone(label)){
    dev=await pick(); // 許可後はラベルが読めるので選び直す
    if(dev){ s.getTracks().forEach(t=>t.stop()); s=await navigator.mediaDevices.getUserMedia({audio:{deviceId:{exact:dev.deviceId}}}); }
  }
  return s;
}

function startWave(){
  const ctx2=waveC.getContext("2d");
  audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  const src=audioCtx.createMediaStreamSource(stream);
  const analyser=audioCtx.createAnalyser();analyser.fftSize=128;
  src.connect(analyser);
  const data=new Uint8Array(analyser.frequencyBinCount);
  const draw=()=>{
    rafId=requestAnimationFrame(draw);
    analyser.getByteFrequencyData(data);
    ctx2.clearRect(0,0,waveC.width,waveC.height);
    const bars=16,step=Math.floor(data.length/bars),bw=waveC.width/bars;
    ctx2.fillStyle="#fff";
    for(let i=0;i<bars;i++){
      const v=data[i*step]/255;
      const h=Math.max(4,v*waveC.height*.95);
      ctx2.beginPath();
      ctx2.roundRect(i*bw+bw*.3,(waveC.height-h)/2,bw*.4,h,bw*.2);
      ctx2.fill();
    }
  };
  draw();
}

function say(t){ waveC.classList.add("hidden"); statusEl.classList.remove("hidden"); statusEl.textContent=t; }

function stopAll(){
  cancelAnimationFrame(rafId);
  if(audioCtx){audioCtx.close().catch(()=>{});audioCtx=null}
  if(mediaRecorder&&mediaRecorder.state!=="inactive")mediaRecorder.stop();
  if(stream)stream.getTracks().forEach(t=>t.stop());
}

/* ✓ 確定 */
function finish(){
  if(done)return;done=true;
  okBtn.disabled=true;cancelBtn.disabled=true;
  spin.classList.remove("hidden"); say("変換中…");
  stopAll(); // onStopped が続きをやる
}
async function onStopped(){
  if(!done)return; // キャンセル時は何もしない
  const blob=new Blob(chunks,{type:chunks[0]?chunks[0].type:"audio/webm"});
  if(blob.size<2000){ spin.classList.add("hidden"); say("聞き取れず"); return closeSoon(1200); }
  let raw="";
  try{
    const b64=await blobToBase64(blob);
    const r=await fetch("/api/transcribe",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({audio:b64,dict:loadDict()})});
    const j=await r.json().catch(()=>null);
    if(j&&j.ok&&j.text)raw=j.text.trim();
  }catch(e){}
  if(!raw){ spin.classList.add("hidden"); say("聞き取れず"); return closeSoon(1400); }
  say("整形中…");
  let polished=raw;
  try{
    const r=await fetch("/api/polish",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({text:raw,style:"clean",dict:loadDict()})});
    const j=await r.json().catch(()=>null);
    if(j&&j.ok&&j.text)polished=j.text;
  }catch(e){}
  saveHistory(polished);
  const copied=await copyText(polished);
  spin.classList.add("hidden");
  statusEl.className="status ok";
  say(copied?"✓ コピー":"コピー失敗");
  closeSoon(copied?500:2000);
}

/* × キャンセル */
function cancel(){
  if(done)return;done=true;
  stopAll();
  say("キャンセル");
  closeSoon(250);
}

okBtn.addEventListener("click",finish);
cancelBtn.addEventListener("click",cancel);
addEventListener("keydown",e=>{
  if(e.code==="Enter"||e.code==="Space"){e.preventDefault();finish();}
  if(e.code==="Escape"){e.preventDefault();cancel();}
});

function closeSoon(ms){
  setTimeout(()=>{
    window.close();
    // app-modeで閉じられない場合の案内
    setTimeout(()=>{ say("⌘Wで閉じる"); },400);
  },ms);
}

async function copyText(t){
  try{ await navigator.clipboard.writeText(t); return true; }catch(e){}
  try{
    const ta=document.createElement("textarea");
    ta.value=t;ta.style.position="fixed";ta.style.opacity="0";
    document.body.appendChild(ta);ta.focus();ta.select();
    const ok=document.execCommand("copy");
    ta.remove();return ok;
  }catch(e){return false}
}

/* 個人辞書。編集は /app の「個人辞書」から（初期値は app.html の DICT_SEED と同じものを持つ） */
const DICT_FALLBACK=[
  {r:"Zuki Voice",w:"ずきぼいす"},{r:"JOOM",w:"じゅーむ"},{r:"Shopee",w:"しょっぴー"},
  {r:"eBay",w:"いーべい"},{r:"クーパン",w:"Coupang"},{r:"チャットワーク"},{r:"クラウドワークス"},
  {r:"Cloudflare",w:"クラウドフレア"},{r:"駿河屋"},{r:"オークファン"},{r:"一番くじ"},{r:"遊戯王"},{r:"ポケカ"},{r:"Wise",w:"ワイズ、YS"},{r:"絵",w:"A",ctx:"を追加|を1枚|を一枚|を2枚|を二枚|を何枚|を入れ|を差し替|の差し替|を描|を貼|を変え|をもう少し|をもっと|を作って|を消して"},{r:"上記",w:"蒸気",ctx:"の件|の内容|の通り|のとおり|適用|で問題|でお願い|を参照|に記載|記載|をご確認|を確認"},{r:"サンキューカード"},{r:"サンキュー",w:"探究、探求",ctx:"カード"},{r:"備考",w:"美行、びこう"}
];
function loadDict(){ try{ const d=JSON.parse(localStorage.getItem("zv_dict")); return (d&&d.length)?d:DICT_FALLBACK; }catch(e){ return DICT_FALLBACK; } }

function saveHistory(text){
  try{
    const h=JSON.parse(localStorage.getItem("zv_history"))||[];
    h.unshift({t:text,at:Date.now()});
    localStorage.setItem("zv_history",JSON.stringify(h.slice(0,50)));
  }catch(e){}
}

function blobToBase64(blob){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>res(String(fr.result).split(",")[1]||"");
    fr.onerror=rej;
    fr.readAsDataURL(blob);
  });
}

start();
</script>
</body>
</html>
