<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zuki Voice ミニ</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23111'/%3E%3Cpath d='M16 7a4 4 0 0 1 4 4v5a4 4 0 0 1-8 0v-5a4 4 0 0 1 4-4z' fill='%23fff'/%3E%3Cpath d='M9.5 16a6.5 6.5 0 0 0 13 0' stroke='%23fff' stroke-width='2.2' fill='none' stroke-linecap='round'/%3E%3Cpath d='M16 22.5V26' stroke='%23fff' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
/* macOSの音声入力ピル風ミニウィンドウ */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;
  background:#1c1c1e;color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  overflow:hidden;user-select:none;
}
.pill{
  display:flex;align-items:center;gap:14px;
  background:#000;border-radius:999px;padding:10px 12px;
  box-shadow:0 10px 36px rgba(0,0,0,.55),0 0 0 .5px rgba(255,255,255,.14);
}
.cbtn{
  width:44px;height:44px;border-radius:50%;border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:transform .12s,background .15s;
}
.cbtn:hover{transform:scale(1.07)}
.cbtn:active{transform:scale(.95)}
.cbtn.x{background:#3a3a3c;color:#fff}
.cbtn.ok{background:#fff;color:#000}
.cbtn:disabled{opacity:.4;cursor:default;transform:none}
canvas#wave{width:150px;height:30px;display:block}
.status{font-size:12.5px;color:#98989f;min-height:1.4em;text-align:center;letter-spacing:.02em}
.status.ok{color:#6fd68a}
.spin{
  width:22px;height:22px;border:2.5px solid rgba(255,255,255,.25);border-top-color:#fff;
  border-radius:50%;animation:sp .7s linear infinite;
}
@keyframes sp{to{transform:rotate(360deg)}}
.hidden{display:none!important}
</style>
</head>
<body>

<div class="pill">
  <button class="cbtn x" id="cancelBtn" title="キャンセル（Esc）">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <canvas id="wave" width="300" height="60"></canvas>
  <div class="spin hidden" id="spin"></div>
  <button class="cbtn ok" id="okBtn" title="確定（Enter / Space）">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.5l5 5L19.5 7"/></svg>
  </button>
</div>
<div class="status" id="status">マイク準備中…</div>

<script>
"use strict";
const $=id=>document.getElementById(id);
const statusEl=$("status"),okBtn=$("okBtn"),cancelBtn=$("cancelBtn"),spin=$("spin"),waveC=$("wave");
let mediaRecorder=null,chunks=[],stream=null,audioCtx=null,rafId=0,done=false;

async function start(){
  try{ stream=await navigator.mediaDevices.getUserMedia({audio:true}); }
  catch(e){ statusEl.textContent="マイクが許可されていません"; okBtn.disabled=true; return; }
  const mime=["audio/webm;codecs=opus","audio/webm","audio/mp4"].find(m=>MediaRecorder.isTypeSupported(m))||"";
  mediaRecorder=new MediaRecorder(stream,mime?{mimeType:mime}:undefined);
  mediaRecorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
  mediaRecorder.onstop=onStopped;
  mediaRecorder.start(250);
  statusEl.textContent="どうぞ話してください";
  startWave();
  setTimeout(()=>{ if(!done) finish(); }, 300000); // 5分で自動確定
}

function startWave(){
  const ctx2=waveC.getContext("2d");
  audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  const src=audioCtx.createMediaStreamSource(stream);
  const analyser=audioCtx.createAnalyser();analyser.fftSize=128;
  src.connect(analyser);
  const data=new Uint8Array(analyser.frequencyBinCount);
  const draw=()=>{
    rafId=requestAnimationFrame(draw);
    analyser.getByteFrequencyData(data);
    ctx2.clearRect(0,0,waveC.width,waveC.height);
    const bars=22,step=Math.floor(data.length/bars),bw=waveC.width/bars;
    ctx2.fillStyle="#fff";
    for(let i=0;i<bars;i++){
      const v=data[i*step]/255;
      const h=Math.max(6,v*waveC.height*.95);
      ctx2.beginPath();
      ctx2.roundRect(i*bw+bw*.3,(waveC.height-h)/2,bw*.4,h,bw*.2);
      ctx2.fill();
    }
  };
  draw();
}

function stopAll(){
  cancelAnimationFrame(rafId);
  if(audioCtx){audioCtx.close().catch(()=>{});audioCtx=null}
  if(mediaRecorder&&mediaRecorder.state!=="inactive")mediaRecorder.stop();
  if(stream)stream.getTracks().forEach(t=>t.stop());
}

/* ✓ 確定 */
function finish(){
  if(done)return;done=true;
  okBtn.disabled=true;cancelBtn.disabled=true;
  waveC.classList.add("hidden");spin.classList.remove("hidden");
  statusEl.textContent="文字起こし中…";
  stopAll(); // onStopped が続きをやる
}
async function onStopped(){
  if(!done)return; // キャンセル時は何もしない
  const blob=new Blob(chunks,{type:chunks[0]?chunks[0].type:"audio/webm"});
  if(blob.size<2000){ statusEl.textContent="聞き取れませんでした"; return closeSoon(1200); }
  let raw="";
  try{
    const b64=await blobToBase64(blob);
    const r=await fetch("/api/transcribe",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({audio:b64})});
    const j=await r.json().catch(()=>null);
    if(j&&j.ok&&j.text)raw=j.text.trim();
  }catch(e){}
  if(!raw){ statusEl.textContent="聞き取れませんでした"; return closeSoon(1400); }
  statusEl.textContent="整形中…";
  let polished=raw;
  try{
    const r=await fetch("/api/polish",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({text:raw,style:"clean"})});
    const j=await r.json().catch(()=>null);
    if(j&&j.ok&&j.text)polished=j.text;
  }catch(e){}
  saveHistory(polished);
  const copied=await copyText(polished);
  spin.classList.add("hidden");
  statusEl.className="status ok";
  statusEl.textContent=copied?"✓ コピーしました":"コピーできませんでした";
  closeSoon(copied?500:2000);
}

/* × キャンセル */
function cancel(){
  if(done)return;done=true;
  stopAll();
  statusEl.textContent="キャンセルしました";
  closeSoon(250);
}

okBtn.addEventListener("click",finish);
cancelBtn.addEventListener("click",cancel);
addEventListener("keydown",e=>{
  if(e.code==="Enter"||e.code==="Space"){e.preventDefault();finish();}
  if(e.code==="Escape"){e.preventDefault();cancel();}
});

function closeSoon(ms){
  setTimeout(()=>{
    window.close();
    // app-modeで閉じられない場合の案内
    setTimeout(()=>{ statusEl.textContent="⌘W で閉じてください"; },400);
  },ms);
}

async function copyText(t){
  try{ await navigator.clipboard.writeText(t); return true; }catch(e){}
  try{
    const ta=document.createElement("textarea");
    ta.value=t;ta.style.position="fixed";ta.style.opacity="0";
    document.body.appendChild(ta);ta.focus();ta.select();
    const ok=document.execCommand("copy");
    ta.remove();return ok;
  }catch(e){return false}
}

function saveHistory(text){
  try{
    const h=JSON.parse(localStorage.getItem("zv_history"))||[];
    h.unshift({t:text,at:Date.now()});
    localStorage.setItem("zv_history",JSON.stringify(h.slice(0,50)));
  }catch(e){}
}

function blobToBase64(blob){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>res(String(fr.result).split(",")[1]||"");
    fr.onerror=rej;
    fr.readAsDataURL(blob);
  });
}

start();
</script>
</body>
</html>
